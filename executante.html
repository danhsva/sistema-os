<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGME - Técnico de Campo</title>
    <style>
        :root { --primary: #2563eb; --primary-dark: #1d4ed8; --bg: #f4f7f6; --card: #ffffff; --text: #1e293b; --border: #e2e8f0; --danger: #ef4444; --success: #10b981; --warning: #f59e0b; --info: #0284c7; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; min-height: 100vh; overflow-x: hidden; }
        .hidden { display: none !important; }
        .card { background: var(--card); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.06); margin-bottom: 20px; border: 1px solid var(--border); }
        h2, h3 { color: var(--primary-dark); margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #475569; }
        select, textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 15px; font-size: 14px; background: #f8fafc; text-transform: uppercase; }
        button { background: var(--primary); color: white; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: var(--primary-dark); }
        .btn-success { background: var(--success); } .btn-secondary { background: #64748b; } .btn-info { background: var(--info); color: #fff; }
        .btn-sm { padding: 6px 12px; font-size: 11px; margin-bottom: 2px; } .btn-block { width: 100%; }
        .badge { background: #e0f2fe; color: #0369a1; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
        .app-layout { display: flex; width: 100%; }
        .sidebar { width: 65px; background: var(--card); border-right: 1px solid var(--border); position: fixed; top: 0; left: 0; bottom: 0; z-index: 999; display: flex; flex-direction: column; overflow-x: hidden; transition: width 0.3s; box-shadow: 2px 0 5px rgba(0,0,0,0.05); white-space: nowrap; }
        .sidebar:hover { width: 250px; }
        .sidebar-logo { padding: 20px; font-size: 18px; font-weight: bold; color: var(--primary-dark); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 15px; }
        .sidebar-menu { display: flex; flex-direction: column; padding: 10px 0; }
        .sidebar-item { display: flex; align-items: center; gap: 15px; padding: 14px 20px; cursor: pointer; background: none; border: none; color: #475569; font-size: 14px; font-weight: 600; text-align: left; width: 100%; border-left: 4px solid transparent; }
        .sidebar-item.active { background: #e0f2fe; color: var(--primary-dark); border-left-color: var(--primary); }
        .sidebar-icon { font-size: 18px; min-width: 20px; text-align: center; }
        .sidebar-text { opacity: 0; transition: opacity 0.3s; }
        .sidebar:hover .sidebar-text { opacity: 1; }
        .main-content { margin-left: 65px; padding: 20px; width: calc(100% - 65px); }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #fff; padding: 15px 20px; border-radius: 10px; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px; }
        th, td { border: 1px solid var(--border); padding: 8px; text-align: left; }
        th { background: #f1f5f9; cursor: pointer; }
        tr:hover { background: #f8fafc; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 15px; }
        .modal-box { background: #ffffff; border-radius: 12px; padding: 25px; width: 100%; max-width: 650px; max-height: 90vh; overflow-y: auto; }
        .timeline { border-left: 3px solid var(--border); padding-left: 15px; margin-top: 15px; font-size: 13px; }
        .timeline-item { margin-bottom: 15px; position: relative; }
        .timeline-item::before { content: ''; position: absolute; left: -24px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--primary); }
        .timeline-date { font-size: 11px; color: #64748b; font-weight: bold; }
        .timeline-user { color: var(--primary-dark); font-weight: bold; margin-bottom: 4px; }
        .timeline-text { background: #f8fafc; padding: 8px; border-radius: 6px; border: 1px solid var(--border); margin-top: 4px; }
    </style>
</head>
<body>
    <div class="app-layout">
        <nav class="sidebar">
            <div class="sidebar-logo"><span class="sidebar-icon">👨‍🔧</span><span class="sidebar-text">Técnico Campo</span></div>
            <div class="sidebar-menu">
                <button class="sidebar-item active"><span class="sidebar-icon">🛠️</span><span class="sidebar-text">O.S. Pendentes</span></button>
            </div>
        </nav>
        <main class="main-content">
            <div class="top-bar">
                <div>
                    <h3 style="margin: 0; color: #334155;">Minha Fila de Atendimento</h3>
                    <div style="margin-top: 4px;"><span id="usuarioNomeDisplay" style="font-weight: 600; font-size: 14px;"></span> <span class="badge">EXECUTANTE</span></div>
                </div>
                <button onclick="fazerLogout()" class="btn-danger">Sair</button>
            </div>
            <div id="conteudoAba" class="card"></div>
        </main>
    </div>

    <!-- MODAL ATENDIMENTO TÉCNICO -->
    <div id="modalTratarOS" class="modal-overlay hidden"><div class="modal-box"><div style="display:flex;justify-content:space-between;align-items:center;"><div><h3 style="margin:0;">O.S. <span id="detalheOsId"></span></h3><span id="detalheOsBadge" class="badge"></span></div><button class="btn-info btn-sm" id="btnImprimirModal" style="padding:8px 12px;">🖨️ PDF</button></div><div style="background:#f8fafc;border:1px solid var(--border);padding:10px;border-radius:6px;margin-top:15px;font-size:13px;"><strong>Equipamento:</strong> <span id="detalheOsEquip"></span><br><strong>Localização:</strong> <span id="detalheOsLocal"></span><br><strong>Defeito Relatado:</strong> <span id="detalheOsDefeito" style="color:var(--danger);"></span></div><div id="boxAcaoOS" style="margin-top:20px;padding-top:15px;border-top:1px solid var(--border);"><h4>Apontamento de Serviço</h4><form onsubmit="salvarTratamentoOS(event)"><input type="hidden" id="tratarOsId"><label>Situação do Atendimento:</label><select id="tratarOsStatus" required><option value="em_execucao">Em Execução</option><option value="aguardando_peca">Aguardando Peça</option><option value="concluida">Concluída (Resolvido)</option></select><label>Relatório Técnico do que foi Feito:</label><textarea id="tratarOsObs" rows="3" placeholder="Ex: Substituição de capacitor e limpeza de filtros..." required></textarea><button type="submit" class="btn-success btn-block">Salvar Apontamento</button></form></div><h4 style="margin-top:25px;">Histórico da O.S.</h4><div id="boxTimeline" class="timeline"></div><button class="btn-secondary btn-block" style="margin-top:20px;" onclick="fecharModal('modalTratarOS')">Fechar</button></div></div>

<script>
    const usuarioLogado = JSON.parse(localStorage.getItem('os_usuario_logado') || 'null');
    if (!usuarioLogado || !usuarioLogado.token || usuarioLogado.perfil !== 'executante') {
        window.location.href = 'index.html';
    }

    const IS_GITHUB_PAGES = window.location.hostname.includes('github.io');
    let servidorBaseUrl = "http://127.0.0.1:8083"; 
    let osCache = [];

    function esc(str) { return str ? String(str).replace(/[&<>'"]/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;' }[m])) : ''; }

    async function apiFetch(endpoint, options = {}) {
        if (!options.headers) options.headers = {};
        options.headers['Authorization'] = `Bearer ${usuarioLogado.token}`;
        options.headers['Content-Type'] = 'application/json';
        const res = await fetch(getApiUrl(endpoint), options);
        if (res.status === 401) { alert("Sessão expirada."); fazerLogout(); throw new Error("401"); }
        return res;
    }

    window.addEventListener('DOMContentLoaded', async () => {
        document.getElementById('usuarioNomeDisplay').textContent = esc(usuarioLogado.nome);
        if (IS_GITHUB_PAGES) {
            try {
                const res = await fetch(`servidor.json?t=${Date.now()}`);
                servidorBaseUrl = (await res.json()).url.replace(/\/+$/, '');
            } catch (err) { console.error("Offline"); }
        }
        carregarOSServer();
    });

    function getApiUrl(ep) { return `${servidorBaseUrl}${ep}`; }
    function fecharModal(id) { document.getElementById(id).classList.add('hidden'); }
    function dataFormatada(timestamp) { return new Date(timestamp).toLocaleString('pt-BR'); }
    function fazerLogout() { localStorage.removeItem('os_usuario_logado'); sessionStorage.clear(); window.location.href = 'index.html'; }

    async function carregarOSServer() {
        const box = document.getElementById('conteudoAba');
        box.innerHTML = `<div style="display:flex;justify-content:space-between;margin-bottom:15px;"><h3>Minhas Tarefas Pendentes</h3><button onclick="carregarOSServer()">Atualizar Fila</button></div><div style="overflow-x:auto;"><table><thead><tr><th>ID / Data</th><th>Local</th><th>Equipamento / Defeito</th><th>Status</th><th>Ações</th></tr></thead><tbody id="tabelaBoxOS"><tr><td colspan="5">Carregando...</td></tr></tbody></table></div>`;
        osCache = await (await apiFetch('/api/os')).json();
        
        const tbody = document.getElementById('tabelaBoxOS');
        if (osCache.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:20px;color:#10b981;font-weight:bold;">🎉 Parabéns! Nenhuma O.S. pendente no momento.</td></tr>';
            return;
        }

        let html = '';
        osCache.forEach(os => {
            let cor = '#f59e0b'; if (os.status.includes('peca')) cor = '#8b5cf6'; if (os.status === 'aprovada') cor = '#0ea5e9';
            html += `<tr><td><strong>#${os.id}</strong><br><small>${dataFormatada(os.data_abertura)}</small></td><td><strong>${esc(os.comarca)}</strong><br><small>${esc(os.predio)} (${esc(os.sala)})</small></td><td style="max-width:250px;"><strong>${esc(os.tipo_equipamento)} ${esc(os.capacidade||'')}</strong><br><small style="color:#64748b;">${esc(os.descricao_falha)}</small></td><td><span class="badge" style="background:${cor};color:white;">${os.status.replace('_', ' ').toUpperCase()}</span></td><td><button class="btn-sm btn-success" onclick="abrirDetalhesOS(${os.id})">Atender / Relatar</button> <button class="btn-sm btn-info" onclick="imprimirOSPdf(${os.id})">🖨️ PDF</button></td></tr>`;
        });
        tbody.innerHTML = html;
    }

    async function abrirDetalhesOS(os_id) {
        document.getElementById('modalTratarOS').classList.remove('hidden');
        document.getElementById('boxTimeline').innerHTML = "Carregando...";
        document.getElementById('tratarOsObs').value = '';
        document.getElementById('btnImprimirModal').onclick = () => imprimirOSPdf(os_id);
        
        try {
            const data = await (await apiFetch(`/api/os/${os_id}`)).json();
            const os = data.os; const hist = data.historico;

            document.getElementById('detalheOsId').textContent = `#${os.id}`;
            document.getElementById('detalheOsBadge').textContent = os.status.replace('_', ' ').toUpperCase();
            document.getElementById('detalheOsEquip').textContent = `${esc(os.tipo_equipamento)} ${esc(os.capacidade||'')} (Tombo: ${esc(os.tombo)})`;
            document.getElementById('detalheOsLocal').textContent = `${esc(os.comarca)} - ${esc(os.predio)} / ${esc(os.sala)}`;
            document.getElementById('detalheOsDefeito').textContent = esc(os.descricao_falha);

            let htmlHist = '';
            hist.forEach(h => { htmlHist += `<div class="timeline-item"><div class="timeline-date">${dataFormatada(h.data_registro)}</div><div class="timeline-user">${esc(h.nome_usuario)} <span class="badge" style="background:#e2e8f0;color:#475569;">${h.acao}</span></div>${h.observacao ? `<div class="timeline-text">${esc(h.observacao)}</div>` : ''}</div>`; });
            document.getElementById('boxTimeline').innerHTML = htmlHist;
            document.getElementById('tratarOsId').value = os.id;
        } catch (err) { document.getElementById('boxTimeline').innerHTML = `<span style="color:red;">Erro ao carregar detalhes.</span>`; }
    }

    async function salvarTratamentoOS(e) {
        e.preventDefault();
        const statusNovo = document.getElementById('tratarOsStatus').value;
        const obsTexto = document.getElementById('tratarOsObs').value.trim().toUpperCase();

        await apiFetch(`/api/os/${document.getElementById('tratarOsId').value}/status`, { 
            method: 'PUT', 
            body: JSON.stringify({ status: statusNovo, observacao: obsTexto }) 
        });
        fecharModal('modalTratarOS'); 
        carregarOSServer(); // Recarrega e remove da fila se tiver concluído!
    }

    async function imprimirOSPdf(os_id) {
        let os = null; let hist = [];
        try {
            const data = await (await apiFetch(`/api/os/${os_id}`)).json();
            os = data.os; hist = data.historico;
        } catch(e) { alert("Erro ao carregar dados."); return; }

        const dataObj = new Date(os.data_abertura);
        const numOSFormatado = `${os.id}.${String(dataObj.getMonth()+1).padStart(2,'0')}.${dataObj.getFullYear()}`;
        let dataAprovacao = '-';
        const hAprov = hist.find(h => h.acao.includes('APROVADA'));
        if (hAprov) { const dA = new Date(hAprov.data_registro); dataAprovacao = `${String(dA.getDate()).padStart(2,'0')}/${String(dA.getMonth()+1).padStart(2,'0')}/${dA.getFullYear()}`; }
        let dataConclusao = os.data_conclusao ? new Date(os.data_conclusao).toLocaleDateString('pt-BR') : '-';
        const descCompleta = `Ar-condicionado ${os.tipo_equipamento} ${os.capacidade||''} ${os.tombo !== 'S/T' ? 'tombo ' + os.tombo : ''}. Defeito: ${os.descricao_falha}`;
        let histHtml = '';
        hist.forEach(h => { histHtml += `<div style="font-size:11px;margin-bottom:6px;border-bottom:1px dotted #ccc;"><strong>${dataFormatada(h.data_registro)} - ${esc(h.nome_usuario)} (${h.acao}):</strong> ${esc(h.observacao||'')}</div>`; });

        const printWindow = window.open('', '_blank');
        printWindow.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>OS_${numOSFormatado}</title><style>@page { size: A4 portrait; margin: 12mm 15mm; } body { font-family: Arial, sans-serif; color: #000; margin: 0; padding: 0; font-size: 11px; } .box-principal { border: 1.5px solid #000; width: 100%; border-collapse: collapse; } .box-principal td, .box-principal th { border: 1px solid #000; padding: 4px 6px; } .cabecalho-doc { text-align: center; font-weight: bold; font-size: 12px; } .titulo-sub { font-size: 11px; font-weight: bold; text-align: center; } .label-col { font-weight: bold; text-align: center; background: #fcfcfc; width: 35%; font-size: 10px; } .val-col { text-align: center; font-weight: 500; font-size: 11px; } .banner-lateral { width: 30px; text-align: center; vertical-align: middle; font-weight: bold; font-size: 12px; letter-spacing: 2px; writing-mode: vertical-rl; transform: rotate(180deg); } .secao-header { background: #fff; font-weight: bold; text-align: center; font-size: 11px; padding: 5px !important; } .rodape-os { margin-top: 15px; text-align: right; font-weight: bold; font-size: 14px; } @media print { .no-print { display: none !important; } }</style></head><body><div class="no-print" style="text-align:center;margin-bottom:20px;"><button style="background:#0284c7;color:#fff;padding:10px 20px;font-weight:bold;border:none;cursor:pointer;border-radius:4px;" onclick="window.print()">🖨️ Imprimir / Salvar como PDF</button></div><div style="text-align:right;font-size:14px;font-weight:bold;margin-bottom:4px;">${os.id}</div><table class="box-principal"><tr><td colspan="3" class="cabecalho-doc">ESTADO DO CEARÁ - PODER JUDICIÁRIO</td></tr><tr><td colspan="3" class="titulo-sub">TRIBUNAL DE JUSTIÇA - GERÊNCIA DE MANUTENÇÃO E ZELADORIA</td></tr><tr><td rowspan="20" class="banner-lateral">ABERTURA</td><td class="label-col">Nº da OS</td><td class="val-col"><strong>${numOSFormatado}</strong></td></tr><tr><td class="label-col">ATENDENTE</td><td class="val-col">${esc(os.nome_solicitante)}</td></tr><tr><td class="label-col">MATRÍCULA DO ATENDENTE</td><td class="val-col">-</td></tr><tr><td colspan="2" class="secao-header">LOCALIZAÇÃO</td></tr><tr><td class="label-col">REQUISITANTE</td><td class="val-col">${esc(os.nome_solicitante)}</td></tr><tr><td class="label-col">MATRÍCULA DO REQUISITANTE</td><td class="val-col">-</td></tr><tr><td class="label-col">TELEFONE/RAMAL CONTATO</td><td class="val-col">0</td></tr><tr><td class="label-col">LOTAÇÃO</td><td class="val-col">${esc(os.sala)}</td></tr><tr><td class="label-col">MUNICÍPIO</td><td class="val-col">${esc(os.comarca)}</td></tr><tr><td class="label-col">REGIÃO</td><td class="val-col">Região I</td></tr><tr><td class="label-col">PRÉDIO</td><td class="val-col">${esc(os.predio)}</td></tr><tr><td class="label-col">LOCAL DE OCORRÊNCIA</td><td class="val-col">${esc(os.sala)}</td></tr><tr><td class="label-col">TIPO DE SOLICITACAO</td><td class="val-col">Manutenção de Equipamento</td></tr><tr><td class="label-col">SERVIÇO</td><td class="val-col">Climatização</td></tr><tr><td class="label-col">CPA/TOMBO</td><td class="val-col"><strong>${esc(os.tombo)}</strong></td></tr><tr><td class="label-col">PRIORIDADE</td><td class="val-col">Não Emergencial</td></tr><tr><td class="label-col">FORNECEDOR</td><td class="val-col">${esc(os.contrato_nome || '-')}</td></tr><tr><td class="label-col">DESCRIÇÃO</td><td class="val-col" style="font-size:10px;">${esc(descCompleta)}</td></tr><tr><td class="label-col">DATA DE APROVAÇÃO</td><td class="val-col">${dataAprovacao}</td></tr><tr><td class="label-col">DATA DE INÍCIO</td><td class="val-col">${dataObj.toLocaleDateString('pt-BR')}</td></tr><tr><td colspan="2" class="label-col">DATA DE CONCLUSÃO</td><td class="val-col">${dataConclusao}</td></tr></table><table class="box-principal" style="border-top:none;margin-top:-1px;"><tr><td class="secao-header">DESCRIÇÃO</td></tr><tr><td style="height:45px;vertical-align:top;padding:6px;">${esc(descCompleta)}</td></tr><tr><td class="secao-header">HISTÓRICO</td></tr><tr><td style="min-height:80px;vertical-align:top;padding:6px;">${histHtml || 'Nenhum histórico.'}</td></tr></table><table class="box-principal" style="border-top:none;margin-top:-1px;"><tr><td class="secao-header" style="width:50%;">ATENDENTE</td><td class="secao-header" style="width:50%;">Executor</td></tr><tr><td style="height:50px;vertical-align:bottom;"><strong>Nome:</strong> ${esc(os.nome_solicitante)}<br><strong>Matrícula:</strong></td><td style="height:50px;vertical-align:bottom;"><strong>Nome:</strong> ${esc(os.nome_executante || '')}<br><strong>CPF:</strong></td></tr></table><div class="rodape-os">Nº da OS: ${numOSFormatado}</div></body></html>`);
        printWindow.document.close();
        printWindow.focus();
    }
</script>
</body>
</html>
