<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de O.S.</title>
    <style>
        :root { --primary: #2563eb; --primary-dark: #1d4ed8; --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --border: #e2e8f0; --danger: #ef4444; --success: #10b981; --warning: #f59e0b; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 15px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .hidden { display: none !important; }
        .card { background: var(--card); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; border: 1px solid var(--border); }
        h2, h3 { color: var(--primary-dark); margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #475569; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 15px; font-size: 14px; background: #f8fafc; }
        button { background: var(--primary); color: white; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        button:hover { background: var(--primary-dark); }
        .btn-danger { background: var(--danger); } .btn-success { background: var(--success); } .btn-secondary { background: #64748b; }
        .btn-sm { padding: 6px 12px; font-size: 11px; } .btn-block { width: 100%; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .badge { background: #e0f2fe; color: #0369a1; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
        .nav-tabs { display: flex; gap: 5px; border-bottom: 2px solid var(--border); margin-bottom: 20px; }
        .nav-tabs button { background: none; color: #64748b; border: none; padding: 12px 20px; font-size: 14px; border-bottom: 3px solid transparent; }
        .nav-tabs button.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 800; }
        
        /* Tabela, Filtros e Ordenação */
        table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px; }
        th, td { border: 1px solid var(--border); padding: 8px; text-align: left; }
        th { background: #f1f5f9; cursor: pointer; user-select: none; }
        th:hover { background: #e2e8f0; }
        tr:hover { background: #f8fafc; }
        .filter-row input { padding: 6px; margin: 0; font-size: 11px; border-radius: 4px; border: 1px solid #cbd5e1; width: 100%; }
        .inativo td { opacity: 0.5; background: #f1f5f9; }
        
        /* Modais */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 15px; }
        .modal-box { background: #ffffff; border-radius: 12px; padding: 25px; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto;}
        .row { display: flex; gap: 10px; } .col { flex: 1; }
        
        /* Timeline Histórico OS */
        .timeline { border-left: 3px solid var(--border); padding-left: 15px; margin-top: 15px; font-size: 13px; }
        .timeline-item { margin-bottom: 15px; position: relative; }
        .timeline-item::before { content: ''; position: absolute; left: -24px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--primary); }
        .timeline-date { font-size: 11px; color: #64748b; font-weight: bold; }
        .timeline-user { color: var(--primary-dark); font-weight: bold; margin-bottom: 4px;}
        .timeline-text { background: #f8fafc; padding: 8px; border-radius: 6px; border: 1px solid var(--border); margin-top: 4px; }
    </style>
</head>
<body>
<div class="container">

    <!-- LOGIN -->
    <div id="authSection" class="card" style="max-width: 400px; margin: 40px auto; text-align: center;">
        <h2>Gest&atilde;o de O.S.</h2>
        <form onsubmit="fazerLogin(event)" style="text-align: left; margin-top: 20px;">
            <label>Login:</label><input type="text" id="loginUser" required>
            <label>Senha:</label><input type="password" id="loginSenha" required>
            <button type="submit" id="btnEntrar" class="btn-block">Entrar no Sistema</button>
        </form>
    </div>

    <!-- MODAL SENHA -->
    <div id="modalSenha" class="modal-overlay hidden">
        <div class="modal-box" style="max-width: 400px;">
            <h3>Defina sua Senha</h3>
            <label>Nova Senha:</label><input type="password" id="novaSenhaInput">
            <button class="btn-success btn-block" onclick="salvarNovaSenha()">Salvar</button>
        </div>
    </div>

    <!-- PAINEL PRINCIPAL -->
    <div id="appSection" class="hidden">
        <div class="top-bar">
            <div>
                <h2 style="margin-bottom: 5px;">Sistema de O.S.</h2>
                <span id="usuarioNomeDisplay" style="font-weight: 600;"></span> <span id="usuarioPerfilDisplay" class="badge"></span>
            </div>
            <button onclick="fazerLogout()" class="btn-danger">Sair</button>
        </div>

        <!-- Abas Admin -->
        <div id="navAdmin" class="nav-tabs hidden">
            <button id="tabAdmUsers" onclick="mudarAba('admUsers')">Usuários</button>
            <button id="tabGeralEqs" onclick="mudarAba('geralEqs')">Equipamentos</button>
            <button id="tabGeralOS" onclick="mudarAba('geralOS')">Gestão de O.S.</button>
        </div>

        <!-- Abas Padrão -->
        <div id="navPadrao" class="nav-tabs hidden">
            <button id="tabGeralEqsPadrao" onclick="mudarAba('geralEqs')">Equipamentos</button>
            <button id="tabGeralOSPadrao" onclick="mudarAba('geralOS')">Ordens de Serviço</button>
        </div>

        <div id="conteudoAba" class="card"></div>
    </div>

    <!-- MODAIS DE CADASTRO -->
    <div id="modalFormEquip" class="modal-overlay hidden">
        <div class="modal-box" style="max-width: 700px;">
            <h3 id="tituloModalEquip">Novo Equipamento</h3>
            <input type="hidden" id="formEqId">
            <div class="row">
                <div class="col"><label>Comarca:</label><input type="text" id="formEqComarca" required></div>
                <div class="col"><label>Prédio:</label><input type="text" id="formEqPredio" required></div>
                <div class="col"><label>Sala (Local):</label><input type="text" id="formEqSala" required></div>
            </div>
            <div class="row">
                <div class="col"><label>Tipo (Equipamento):</label><input type="text" id="formEqTipo" required></div>
                <div class="col"><label>Capacidade:</label><input type="text" id="formEqCap"></div>
            </div>
            <div class="row">
                <div class="col"><label>Marca:</label><input type="text" id="formEqMarca"></div>
                <div class="col"><label>Tombo:</label><input type="text" id="formEqTombo"></div>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button class="btn-success btn-block" onclick="salvarEquipamento()">Salvar</button>
                <button class="btn-secondary btn-block" onclick="fecharModal('modalFormEquip')">Cancelar</button>
            </div>
        </div>
    </div>

    <div id="modalFormUser" class="modal-overlay hidden">
        <div class="modal-box" style="max-width: 400px;">
            <h3>Novo Usuário</h3>
            <label>Nome Completo:</label><input type="text" id="formUserNome" required>
            <label>Login de Acesso:</label><input type="text" id="formUserLogin" required>
            <label>Perfil:</label>
            <select id="formUserPerfil">
                <option value="solicitante">Solicitante</option>
                <option value="fiscal">Fiscal</option>
                <option value="executante">Executante</option>
                <option value="contratada">Contratada</option>
                <option value="administrador">Administrador</option>
            </select>
            <div style="display: flex; gap: 10px;">
                <button class="btn-success btn-block" onclick="salvarUsuario()">Salvar</button>
                <button class="btn-secondary btn-block" onclick="fecharModal('modalFormUser')">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- MODAIS DE O.S. -->
    <div id="modalAbrirOS" class="modal-overlay hidden">
        <div class="modal-box" style="max-width: 500px;">
            <h3>Abrir O.S.</h3>
            <div style="background: #f1f5f9; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 13px;">
                <strong id="osEquipDesc"></strong><br><span id="osEquipLocal"></span>
            </div>
            <input type="hidden" id="osEquipamentoId">
            <label>Relato do Defeito:</label><textarea id="osDescricao" rows="3"></textarea>
            <label>Prioridade:</label>
            <select id="osPrioridade"><option value="baixa">Baixa</option><option value="media" selected>Média</option><option value="alta">Alta</option><option value="urgente">Urgente</option></select>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button class="btn-success btn-block" onclick="enviarOS()">Registrar O.S.</button>
                <button class="btn-secondary btn-block" onclick="fecharModal('modalAbrirOS')">Cancelar</button>
            </div>
        </div>
    </div>

    <div id="modalTratarOS" class="modal-overlay hidden">
        <div class="modal-box">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 style="margin:0;">Detalhes da O.S. <span id="detalheOsId"></span></h3>
                <span id="detalheOsBadge" class="badge"></span>
            </div>
            
            <div style="background: #f8fafc; border: 1px solid var(--border); padding: 10px; border-radius: 6px; margin-top: 15px; font-size: 13px;">
                <strong>Equipamento:</strong> <span id="detalheOsEquip"></span><br>
                <strong>Local:</strong> <span id="detalheOsLocal"></span><br>
                <strong>Defeito Inicial:</strong> <span id="detalheOsDefeito" style="color: var(--danger);"></span>
            </div>

            <div id="boxAcaoOS" style="margin-top: 20px; padding-top: 15px; border-top: 1px solid var(--border);">
                <h4>Atualizar / Tramitar Chamado</h4>
                <input type="hidden" id="tratarOsId">
                <label>Novo Status:</label>
                <select id="tratarOsStatus">
                    <option value="em_analise">Em Análise</option>
                    <option value="aguardando_peca">Aguardando Peça</option>
                    <option value="em_execucao">Em Execução</option>
                    <option value="concluida">Concluída (Resolvido)</option>
                    <option value="cancelada">Cancelada (Improcedente / Erro)</option>
                </select>
                <label>Relatório Técnico / Observação:</label>
                <textarea id="tratarOsObs" rows="3" placeholder="O que foi feito?"></textarea>
                <button class="btn-success btn-block" onclick="salvarTratamentoOS()">Gravar Atualização</button>
            </div>

            <h4 style="margin-top: 25px;">Histórico da O.S.</h4>
            <div id="boxTimeline" class="timeline"></div>
            <button class="btn-secondary btn-block" style="margin-top: 20px;" onclick="fecharModal('modalTratarOS')">Fechar Detalhes</button>
        </div>
    </div>

</div>

<script>
    const IS_GITHUB_PAGES = window.location.hostname.includes('github.io');
    let servidorBaseUrl = "http://127.0.0.1:8083"; 
    let usuarioLogado = null;
    let equipamentosCache = []; 

    // Variáveis para Ordenação e Filtro
    let eqSortCol = 'comarca';
    let eqSortAsc = true;
    let eqFiltros = { comarca: '', predio: '', sala: '', tipo: '', cap: '', tombo: '', status: '' };

    window.addEventListener('DOMContentLoaded', async () => {
        if (IS_GITHUB_PAGES) await descobrirUrlServidor();
        const sessao = localStorage.getItem('os_usuario_logado');
        if (sessao) { usuarioLogado = JSON.parse(sessao); verificarPrimeiroAcesso(); }
    });

    async function descobrirUrlServidor() {
        try { servidorBaseUrl = (await (await fetch(`servidor.json?t=${Date.now()}`)).json()).url.replace(/\/+$/, ''); } 
        catch (err) { console.error("Servidor offline"); }
    }
    
    function getApiUrl(ep) { return `${servidorBaseUrl}${ep}`; }
    function fecharModal(id) { document.getElementById(id).classList.add('hidden'); }
    function dataFormatada(timestamp) { return new Date(timestamp).toLocaleString('pt-BR'); }

    // ====== LOGIN & SEGURANÇA ======
    async function fazerLogin(e) {
        e.preventDefault();
        const btn = document.getElementById('btnEntrar');
        btn.disabled = true; btn.textContent = 'Autenticando...';
        try {
            const res = await fetch(getApiUrl('/api/login'), { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ login: document.getElementById('loginUser').value.trim(), senha: document.getElementById('loginSenha').value }) });
            const data = await res.json();
            if (res.ok) { localStorage.setItem('os_usuario_logado', JSON.stringify(data)); usuarioLogado = data; verificarPrimeiroAcesso(); } else alert(data.erro);
        } catch(e) { alert("Erro de conexão"); }
        btn.disabled = false; btn.textContent = 'Entrar no Sistema';
    }
    function fazerLogout() { localStorage.removeItem('os_usuario_logado'); location.reload(); }
    function verificarPrimeiroAcesso() {
        if (usuarioLogado.primeiro_acesso === 1) { document.getElementById('authSection').classList.add('hidden'); document.getElementById('modalSenha').classList.remove('hidden'); }
        else { document.getElementById('modalSenha').classList.add('hidden'); mostrarPainel(); }
    }
    async function salvarNovaSenha() {
        const nova = document.getElementById('novaSenhaInput').value;
        if (nova.length < 4) return alert("Mínimo 4 caracteres.");
        await fetch(getApiUrl('/api/trocar-senha'), { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ usuario_id: usuarioLogado.id, nova_senha: nova }) });
        usuarioLogado.primeiro_acesso = 0; localStorage.setItem('os_usuario_logado', JSON.stringify(usuarioLogado)); verificarPrimeiroAcesso();
    }

    // ====== NAVEGAÇÃO ======
    function mostrarPainel() {
        document.getElementById('authSection').classList.add('hidden');
        document.getElementById('appSection').classList.remove('hidden');
        document.getElementById('usuarioNomeDisplay').textContent = usuarioLogado.nome;
        document.getElementById('usuarioPerfilDisplay').textContent = usuarioLogado.perfil;
        
        if (usuarioLogado.perfil === 'administrador') { document.getElementById('navAdmin').classList.remove('hidden'); mudarAba('geralEqs'); }
        else { document.getElementById('navPadrao').classList.remove('hidden'); mudarAba('geralEqs'); }
    }

    function mudarAba(abaId) {
        document.querySelectorAll('.nav-tabs button').forEach(b => b.classList.remove('active'));
        if(usuarioLogado.perfil === 'administrador' && document.getElementById(`tab${abaId.charAt(0).toUpperCase() + abaId.slice(1)}`)){
            document.getElementById(`tab${abaId.charAt(0).toUpperCase() + abaId.slice(1)}`).classList.add('active');
        } else if (document.getElementById(`tab${abaId.charAt(0).toUpperCase() + abaId.slice(1)}Padrao`)) {
            document.getElementById(`tab${abaId.charAt(0).toUpperCase() + abaId.slice(1)}Padrao`).classList.add('active');
        }
        
        const box = document.getElementById('conteudoAba');
        if (abaId === 'admUsers') renderAdmUsers(box);
        if (abaId === 'geralEqs') carregarEquipamentosServer(box); 
        if (abaId === 'geralOS') renderAbaOS(box);
    }

    // ====== GESTÃO DE USUÁRIOS (ADMIN) ======
    async function renderAdmUsers(box) {
        box.innerHTML = `<div style="display:flex; justify-content:space-between; margin-bottom:15px;"><h3>Gestão de Usuários</h3><button class="btn-success" onclick="abrirModalUser()">+ Novo Usuário</button></div><div id="tabelaUsers">Carregando...</div>`;
        const users = await (await fetch(getApiUrl('/api/usuarios'))).json();
        let html = `<table><thead><tr><th>Nome</th><th>Login</th><th>Perfil</th></tr></thead><tbody>`;
        users.forEach(u => html += `<tr><td>${u.nome}</td><td>${u.login}</td><td><span class="badge">${u.perfil}</span></td></tr>`);
        document.getElementById('tabelaUsers').innerHTML = html + `</tbody></table>`;
    }
    function abrirModalUser() { document.querySelectorAll('#modalFormUser input').forEach(i => i.value=''); document.getElementById('modalFormUser').classList.remove('hidden'); }
    async function salvarUsuario() {
        const p = { nome: document.getElementById('formUserNome').value, login: document.getElementById('formUserLogin').value, perfil: document.getElementById('formUserPerfil').value };
        const res = await fetch(getApiUrl('/api/usuarios'), { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(p) });
        if(res.ok) { fecharModal('modalFormUser'); mudarAba('admUsers'); } else alert((await res.json()).erro);
    }

    // ====== TABELA UNIFICADA DE EQUIPAMENTOS (COM FILTROS CORRIGIDOS) ======
    async function carregarEquipamentosServer(box) {
        box.innerHTML = `<div style="display:flex; justify-content:space-between; margin-bottom:15px;">
            <h3>Base de Equipamentos</h3>
            ${usuarioLogado.perfil === 'administrador' ? '<button class="btn-success" onclick="abrirModalEquip(null)">+ Novo Equipamento</button>' : ''}
        </div>
        <div style="overflow-x: auto;">
            <table>
                <thead id="headFiltros"></thead>
                <tbody id="tabelaBoxEq"><tr><td colspan="8">Carregando dados...</td></tr></tbody>
            </table>
        </div>
        <div id="totalEqs" style="font-size:12px; color:#64748b; margin-top:10px;"></div>`;
        
        equipamentosCache = await (await fetch(getApiUrl('/api/equipamentos'))).json();
        renderizarCabecalhoEq();
        desenharTabelaEquipamentos();
    }

    function renderizarCabecalhoEq() {
        const iconSort = eqSortAsc ? ' ▴' : ' ▾';
        const col = (nome, cod) => `<th onclick="setEqSort('${cod}')">${nome}${eqSortCol === cod ? iconSort : ''}</th>`;
        
        document.getElementById('headFiltros').innerHTML = `
            <tr>
                ${col('Comarca', 'comarca')}
                ${col('Prédio', 'predio')}
                ${col('Local (Sala)', 'sala')}
                ${col('Equipamento', 'tipo_equipamento')}
                ${col('Capacidade', 'capacidade')}
                ${col('Tombo', 'tombo')}
                ${col('Status', 'status')}
                <th>Ações</th>
            </tr>
            <tr class="filter-row">
                <td><input type="text" placeholder="Buscar..." oninput="setEqFiltro('comarca', this.value)" value="${eqFiltros.comarca}"></td>
                <td><input type="text" placeholder="Buscar..." oninput="setEqFiltro('predio', this.value)" value="${eqFiltros.predio}"></td>
                <td><input type="text" placeholder="Buscar..." oninput="setEqFiltro('sala', this.value)" value="${eqFiltros.sala}"></td>
                <td><input type="text" placeholder="Buscar..." oninput="setEqFiltro('tipo', this.value)" value="${eqFiltros.tipo}"></td>
                <td><input type="text" placeholder="Buscar..." oninput="setEqFiltro('cap', this.value)" value="${eqFiltros.cap}"></td>
                <td><input type="text" placeholder="Buscar..." oninput="setEqFiltro('tombo', this.value)" value="${eqFiltros.tombo}"></td>
                <td><input type="text" placeholder="ativo/inat..." oninput="setEqFiltro('status', this.value)" value="${eqFiltros.status}"></td>
                <td><button class="btn-sm btn-secondary" onclick="limparFiltrosEq()" style="padding:6px;width:100%;">Limpar</button></td>
            </tr>
        `;
    }

    function limparFiltrosEq() {
        eqFiltros = { comarca: '', predio: '', sala: '', tipo: '', cap: '', tombo: '', status: '' };
        renderizarCabecalhoEq();
        desenharTabelaEquipamentos();
    }

    function setEqFiltro(campo, valor) { 
        eqFiltros[campo] = valor.toLowerCase(); 
        desenharTabelaEquipamentos(); 
    }
    
    function setEqSort(coluna) {
        if(eqSortCol === coluna) { eqSortAsc = !eqSortAsc; } else { eqSortCol = coluna; eqSortAsc = true; }
        renderizarCabecalhoEq(); // Redesenha a seta no cabeçalho
        desenharTabelaEquipamentos();
    }

    function desenharTabelaEquipamentos() {
        const tbody = document.getElementById('tabelaBoxEq');
        if(!tbody) return;

        let filtrados = equipamentosCache.filter(eq => {
            if (usuarioLogado.perfil !== 'administrador' && eq.ativo !== 1) return false;
            if (eqFiltros.comarca && !(eq.comarca||'').toLowerCase().includes(eqFiltros.comarca)) return false;
            if (eqFiltros.predio && !(eq.predio||'').toLowerCase().includes(eqFiltros.predio)) return false;
            if (eqFiltros.sala && !(eq.sala||'').toLowerCase().includes(eqFiltros.sala)) return false;
            if (eqFiltros.tipo && !(eq.tipo_equipamento||'').toLowerCase().includes(eqFiltros.tipo)) return false;
            if (eqFiltros.cap && !(eq.capacidade||'').toLowerCase().includes(eqFiltros.cap)) return false;
            if (eqFiltros.tombo && !(eq.tombo||'').toLowerCase().includes(eqFiltros.tombo)) return false;
            let statusTexto = eq.ativo === 1 ? 'ativo' : 'inativo';
            if (eqFiltros.status && !statusTexto.includes(eqFiltros.status)) return false;
            return true;
        });

        filtrados.sort((a, b) => {
            let valA = (a[eqSortCol] || '').toString().toLowerCase();
            let valB = (b[eqSortCol] || '').toString().toLowerCase();
            if(eqSortCol === 'status') { valA = a.ativo; valB = b.ativo; }
            if (valA < valB) return eqSortAsc ? -1 : 1;
            if (valA > valB) return eqSortAsc ? 1 : -1;
            return 0;
        });

        let html = '';
        filtrados.forEach(eq => {
            const inativoStr = eq.ativo === 0 ? 'class="inativo"' : '';
            const statusLabel = eq.ativo === 1 ? '<span style="color:var(--success);font-weight:bold;">Ativo</span>' : '<span style="color:var(--danger);font-weight:bold;">Inativo</span>';
            
            let acoes = '';
            // Se ativo, qualquer um pode abrir O.S.
            if (eq.ativo === 1) acoes += `<button class="btn-sm btn-success" onclick="abrirOS(${eq.id}, '${eq.tipo_equipamento} ${eq.capacidade||''}', '${eq.comarca} - ${eq.predio} / ${eq.sala}')">Abrir O.S.</button> `;
            
            // Apenas Admin pode editar e Inativar
            if (usuarioLogado.perfil === 'administrador') {
                acoes += `<button class="btn-sm btn-secondary" onclick="abrirModalEquip(${eq.id})">Editar</button> `;
                if(eq.ativo === 1) acoes += `<button class="btn-sm btn-danger" onclick="toggleAtivoEq(${eq.id}, 0)">Inativar</button>`;
                else acoes += `<button class="btn-sm" style="background:#10b981;" onclick="toggleAtivoEq(${eq.id}, 1)">Ativar</button>`;
            }

            html += `<tr ${inativoStr}>
                <td>${eq.comarca}</td>
                <td>${eq.predio}</td>
                <td>${eq.sala}</td>
                <td>${eq.tipo_equipamento}</td>
                <td>${eq.capacidade||'-'}</td>
                <td>${eq.tombo === 'S/T' ? '<span class="badge" style="background:#e2e8f0;color:#64748b;">S/T</span>' : eq.tombo}</td>
                <td>${statusLabel}</td>
                <td style="white-space: nowrap;">${acoes}</td>
            </tr>`;
        });
        
        tbody.innerHTML = html;
        document.getElementById('totalEqs').textContent = `Total listado: ${filtrados.length} equipamento(s).`;
    }

    // Modal Equipamento Admin
    function abrirModalEquip(id) {
        document.getElementById('modalFormEquip').classList.remove('hidden');
        if(id) {
            const eq = equipamentosCache.find(e => e.id === id);
            document.getElementById('tituloModalEquip').textContent = 'Editar Equipamento';
            document.getElementById('formEqId').value = eq.id; document.getElementById('formEqComarca').value = eq.comarca;
            document.getElementById('formEqPredio').value = eq.predio; document.getElementById('formEqSala').value = eq.sala;
            document.getElementById('formEqTipo').value = eq.tipo_equipamento; document.getElementById('formEqCap').value = eq.capacidade || '';
            document.getElementById('formEqMarca').value = eq.marca || ''; document.getElementById('formEqTombo').value = eq.tombo === 'S/T' ? '' : eq.tombo;
        } else {
            document.getElementById('tituloModalEquip').textContent = 'Novo Equipamento';
            document.getElementById('formEqId').value = '';
            document.querySelectorAll('#modalFormEquip input:not([type=hidden])').forEach(i => i.value='');
        }
    }
    async function salvarEquipamento() {
        const id = document.getElementById('formEqId').value;
        const payload = { comarca: document.getElementById('formEqComarca').value.trim(), predio: document.getElementById('formEqPredio').value.trim(), sala: document.getElementById('formEqSala').value.trim(), tipo_equipamento: document.getElementById('formEqTipo').value.trim(), capacidade: document.getElementById('formEqCap').value.trim(), marca: document.getElementById('formEqMarca').value.trim(), tombo: document.getElementById('formEqTombo').value.trim() || 'S/T', ativo: id ? equipamentosCache.find(e => e.id == id).ativo : 1 };
        await fetch(getApiUrl(id ? `/api/equipamentos/${id}` : '/api/equipamentos'), { method: id ? 'PUT' : 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
        fecharModal('modalFormEquip'); mudarAba('geralEqs');
    }
    async function toggleAtivoEq(id, status) {
        const eq = equipamentosCache.find(e => e.id == id); eq.ativo = status;
        await fetch(getApiUrl(`/api/equipamentos/${id}`), { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(eq) });
        mudarAba('geralEqs');
    }

    // ====== ABERTURA E GESTÃO DE O.S. ======
    function abrirOS(id, desc, local) {
        document.getElementById('osEquipamentoId').value = id; document.getElementById('osEquipDesc').textContent = desc;
        document.getElementById('osEquipLocal').textContent = local; document.getElementById('osDescricao').value = '';
        document.getElementById('modalAbrirOS').classList.remove('hidden');
    }
    async function enviarOS() {
        const payload = { equipamento_id: document.getElementById('osEquipamentoId').value, solicitante_id: usuarioLogado.id, descricao_falha: document.getElementById('osDescricao').value, prioridade: document.getElementById('osPrioridade').value };
        if(!payload.descricao_falha) return alert("Descreva a falha.");
        await fetch(getApiUrl('/api/os'), { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
        fecharModal('modalAbrirOS'); mudarAba('geralOS');
    }

    async function renderAbaOS(box) {
        box.innerHTML = `<div style="display:flex; justify-content:space-between; margin-bottom:15px;">
            <h3>Ordens de Serviço</h3><button onclick="mudarAba('geralOS')">Atualizar O.S.</button></div><div id="tabOsBox" style="overflow-x:auto;">Carregando...</div>`;
        const chamados = await (await fetch(getApiUrl('/api/os'))).json();
        
        let html = `<table><thead><tr><th>ID / Data</th><th>Local</th><th>Equipamento / Defeito</th><th>Status</th><th>Ações</th></tr></thead><tbody>`;
        chamados.forEach(os => {
            let cor = '#3b82f6'; if(os.status==='concluida') cor='#10b981'; if(os.status==='cancelada') cor='#ef4444'; if(os.status.includes('execucao')) cor='#f59e0b'; if(os.status.includes('peca')) cor='#8b5cf6';
            html += `<tr><td><strong>#${os.id}</strong><br><small>${dataFormatada(os.data_abertura)}</small></td>
                <td><strong>${os.comarca}</strong><br><small>${os.predio} (${os.sala})</small></td>
                <td style="max-width:250px;"><strong>${os.tipo_equipamento} ${os.capacidade||''}</strong><br><small style="color:#64748b;">${os.descricao_falha}</small></td>
                <td><span class="badge" style="background:${cor};color:white;">${os.status.replace('_', ' ').toUpperCase()}</span></td>
                <td><button class="btn-sm btn-secondary" onclick="abrirDetalhesOS(${os.id})">Detalhes / Tratar</button></td></tr>`;
        });
        document.getElementById('tabOsBox').innerHTML = html + `</tbody></table>`;
    }

    async function abrirDetalhesOS(os_id) {
        document.getElementById('modalTratarOS').classList.remove('hidden');
        document.getElementById('boxTimeline').innerHTML = "Carregando...";
        document.getElementById('boxAcaoOS').classList.add('hidden'); document.getElementById('tratarOsObs').value = '';
        
        const data = await (await fetch(getApiUrl(`/api/os/${os_id}`))).json();
        const os = data.os; const hist = data.historico;

        document.getElementById('detalheOsId').textContent = `#${os.id}`;
        document.getElementById('detalheOsBadge').textContent = os.status.replace('_', ' ').toUpperCase();
        document.getElementById('detalheOsEquip').textContent = `${os.tipo_equipamento} ${os.capacidade||''} (Tombo: ${os.tombo})`;
        document.getElementById('detalheOsLocal').textContent = `${os.comarca} - ${os.predio} / ${os.sala}`;
        document.getElementById('detalheOsDefeito').textContent = os.descricao_falha;

        let htmlHist = '';
        hist.forEach(h => { htmlHist += `<div class="timeline-item"><div class="timeline-date">${dataFormatada(h.data_registro)}</div><div class="timeline-user">${h.nome_usuario} <span class="badge" style="background:#e2e8f0; color:#475569;">${h.acao}</span></div>${h.observacao ? `<div class="timeline-text">${h.observacao}</div>` : ''}</div>`; });
        document.getElementById('boxTimeline').innerHTML = htmlHist;

        let podeTratar = false;
        if (usuarioLogado.perfil === 'administrador') {
            podeTratar = true; 
        } else if (usuarioLogado.perfil !== 'solicitante' && os.status !== 'concluida' && os.status !== 'cancelada') {
            podeTratar = true; 
        }

        if (podeTratar) {
            document.getElementById('boxAcaoOS').classList.remove('hidden');
            document.getElementById('tratarOsId').value = os.id;
        }
    }

    async function salvarTratamentoOS() {
        const p = { status: document.getElementById('tratarOsStatus').value, observacao: document.getElementById('tratarOsObs').value.trim(), usuario_id: usuarioLogado.id };
        if (!p.observacao) return alert("Insira um relatório/observação.");
        await fetch(getApiUrl(`/api/os/${document.getElementById('tratarOsId').value}/status`), { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(p) });
        fecharModal('modalTratarOS'); mudarAba('geralOS');
    }
</script>
