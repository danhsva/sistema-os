<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGME - Empresa Contratada</title>
    <style>
        :root { --primary: #2563eb; --primary-dark: #1d4ed8; --bg: #f4f7f6; --card: #ffffff; --text: #1e293b; --border: #e2e8f0; --danger: #ef4444; --success: #10b981; --warning: #f59e0b; --info: #0284c7; --row-alert: #fffbeb; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; min-height: 100vh; overflow-x: hidden; }
        .hidden { display: none !important; }
        .card { background: var(--card); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.06); margin-bottom: 20px; border: 1px solid var(--border); }
        h2, h3 { color: var(--primary-dark); margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #475569; }
        input[type="text"], input[type="file"], select, textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 15px; font-size: 14px; background: #f8fafc; }
        textarea { text-transform: uppercase; }
        button { background: var(--primary); color: white; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: var(--primary-dark); }
        .btn-success { background: var(--success); } .btn-secondary { background: #64748b; } .btn-info { background: var(--info); color: #fff; }
        .btn-sm { padding: 6px 12px; font-size: 11px; margin-bottom: 2px; } .btn-block { width: 100%; }
        .badge { background: #e0f2fe; color: #0369a1; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
        .app-layout { display: flex; width: 100%; }
        .sidebar { width: 65px; background: var(--card); border-right: 1px solid var(--border); position: fixed; top: 0; left: 0; bottom: 0; z-index: 999; display: flex; flex-direction: column; overflow-x: hidden; transition: width 0.3s; box-shadow: 2px 0 5px rgba(0,0,0,0.05); white-space: nowrap; }
        .sidebar:hover { width: 250px; }
        .sidebar-logo { padding: 20px; font-size: 18px; font-weight: bold; color: var(--primary-dark); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 15px; }
        .sidebar-menu { display: flex; flex-direction: column; padding: 10px 0; }
        .sidebar-item { display: flex; align-items: center; gap: 15px; padding: 14px 20px; cursor: pointer; background: none; border: none; color: #475569; font-size: 14px; font-weight: 600; text-align: left; width: 100%; border-left: 4px solid transparent; }
        .sidebar-item:hover { background: #f1f5f9; color: var(--primary); }
        .sidebar-item.active { background: #e0f2fe; color: var(--primary-dark); border-left-color: var(--primary); }
        .sidebar-icon { font-size: 18px; min-width: 20px; text-align: center; }
        .sidebar-text { opacity: 0; transition: opacity 0.3s; }
        .sidebar:hover .sidebar-text { opacity: 1; }
        .main-content { margin-left: 65px; padding: 20px; width: calc(100% - 65px); }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #fff; padding: 15px 20px; border-radius: 10px; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px; }
        th, td { border: 1px solid var(--border); padding: 8px; text-align: left; }
        th { background: #f1f5f9; cursor: pointer; }
        tr:hover { background: #f8fafc; }
        .filter-row input { padding: 6px; margin: 0; font-size: 11px; border-radius: 4px; border: 1px solid #cbd5e1; width: 100%; }
        .row-os-ativa { background-color: var(--row-alert) !important; border-left: 3px solid var(--warning); }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 15px; }
        .modal-box { background: #ffffff; border-radius: 12px; padding: 25px; width: 100%; max-width: 650px; max-height: 90vh; overflow-y: auto; }
        .timeline { border-left: 3px solid var(--border); padding-left: 15px; margin-top: 15px; font-size: 13px; }
        .timeline-item { margin-bottom: 15px; position: relative; }
        .timeline-item::before { content: ''; position: absolute; left: -24px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--primary); }
        .timeline-date { font-size: 11px; color: #64748b; font-weight: bold; }
        .timeline-user { color: var(--primary-dark); font-weight: bold; margin-bottom: 4px; }
        .timeline-text { background: #f8fafc; padding: 8px; border-radius: 6px; border: 1px solid var(--border); margin-top: 4px; }
    </style>
</head>
<body>
    <div class="app-layout">
        <nav class="sidebar">
            <div class="sidebar-logo"><span class="sidebar-icon">🛠️</span><span class="sidebar-text">SGME Contratada</span></div>
            <div class="sidebar-menu">
                <button id="tabGeralOS" class="sidebar-item" onclick="mudarAba('geralOS')"><span class="sidebar-icon">🛠️</span><span class="sidebar-text">Ordens de Serviço</span></button>
                <button id="tabGeralEqs" class="sidebar-item" onclick="mudarAba('geralEqs')"><span class="sidebar-icon">💻</span><span class="sidebar-text">Equipamentos</span></button>
            </div>
        </nav>
        <main class="main-content">
            <div class="top-bar">
                <div>
                    <h3 style="margin: 0; color: #334155;">Painel da Contratada</h3>
                    <div style="margin-top: 4px;"><span id="usuarioNomeDisplay" style="font-weight: 600; font-size: 14px;"></span> <span class="badge">CONTRATADA</span></div>
                </div>
                <button onclick="fazerLogout()" class="btn-danger">Sair</button>
            </div>
            <div id="conteudoAba" class="card"></div>
        </main>
    </div>

    <!-- MODAL TRATAMENTO CONTRATADA -->
    <div id="modalTratarOS" class="modal-overlay hidden"><div class="modal-box">
        <div style="display:flex;justify-content:space-between;align-items:center;">
            <div><h3 style="margin:0;">Atendimento da O.S. <span id="detalheOsId"></span></h3><span id="detalheOsBadge" class="badge"></span></div>
            <button class="btn-info btn-sm" id="btnImprimirModal" style="padding:8px 12px;">🖨️ PDF</button>
        </div>
        <div style="background:#f8fafc;border:1px solid var(--border);padding:10px;border-radius:6px;margin-top:15px;font-size:13px;">
            <strong>Equipamento:</strong> <span id="detalheOsEquip"></span><br>
            <strong>Local:</strong> <span id="detalheOsLocal"></span><br>
            <strong>Técnico Responsável:</strong> <span id="detalheOsExecutante" style="color:var(--primary-dark);font-weight:bold;"></span><br>
            <strong>Defeito:</strong> <span id="detalheOsDefeito" style="color:var(--danger);"></span><br>
            <div id="boxLinkAnexo" class="hidden" style="margin-top:10px;"></div>
        </div>

        <div id="boxAcaoOS" style="margin-top:20px;padding-top:15px;border-top:1px solid var(--border);">
            <h4>Encaminhamento do Chamado</h4>
            <form onsubmit="salvarTratamentoOS(event)">
                <input type="hidden" id="tratarOsId">
                <label>Ação a Tomar:</label>
                <select id="tratarOsStatus" required onchange="ajustarCamposContratada()">
                    <option value="em_execucao">1. Encaminhar para o Técnico Executante</option>
                    <option value="aguardando_peca">2. Informar que está Aguardando Peça</option>
                    <option value="concluida">3. Concluir a O.S. (Anexar Folha Assinada)</option>
                </select>

                <div id="boxDelegarExecutante">
                    <label>Designar Técnico da Equipe:</label>
                    <select id="tratarOsExecutante"></select>
                </div>

                <div id="boxObs">
                    <label id="lblObs">Observação Técnica:</label>
                    <textarea id="tratarOsObs" rows="3" placeholder="Insira informações..."></textarea>
                </div>

                <div id="boxAnexoConclusao" class="hidden" style="background:#ecfdf5;padding:12px;border-radius:6px;border:1px dashed #10b981;margin-bottom:15px;">
                    <label style="color:#065f46;">Foto ou PDF da O.S. Assinada (Obrigatório):</label>
                    <input type="file" id="arquivoOS" accept="image/jpeg,image/png,application/pdf">
                </div>

                <button type="submit" class="btn-success btn-block" id="btnSalvarTratamento">Confirmar Ação</button>
            </form>
        </div>

        <h4 style="margin-top:25px;">Histórico da O.S.</h4>
        <div id="boxTimeline" class="timeline"></div>
        <button class="btn-secondary btn-block" style="margin-top:20px;" onclick="fecharModal('modalTratarOS')">Fechar</button>
    </div></div>

    <div id="modalHistoricoEqOS" class="modal-overlay hidden"><div class="modal-box" style="max-width: 700px;"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;"><h3 style="margin:0;">Histórico do Equipamento</h3><button class="btn-danger btn-sm" onclick="fecharModal('modalHistoricoEqOS')">X</button></div><div style="overflow-x:auto;"><table style="margin-top:0;"><thead><tr><th>O.S. / Data</th><th>Defeito</th><th>Status</th><th>Ações</th></tr></thead><tbody id="tabelaHistoricoEqOS"></tbody></table></div></div></div>

<script src="shared.js"></script>
<script>
    let equipamentosCache = []; let osCache = [];
    let eqSortCol = 'comarca'; let eqSortAsc = true; let eqDebounceTimeout = null;
    let eqFiltros = { comarca:'', predio:'', sala:'', tipo:'', cap:'', tombo:'', status:'' };
    let osFiltros = { id:'', comarca:'', status:'' };

    window.addEventListener('DOMContentLoaded', async () => {
        const user = await inicializarCore('contratada');
        if (!user) return;
        mudarAba(sessionStorage.getItem('os_aba_contratada') || 'geralOS');
    });

    function mudarAba(abaId) {
        sessionStorage.setItem('os_aba_contratada', abaId);
        document.querySelectorAll('.sidebar-item').forEach(b => b.classList.remove('active'));
        let btn = document.getElementById(`tab${abaId.charAt(0).toUpperCase() + abaId.slice(1)}`);
        if (btn) btn.classList.add('active');
        const box = document.getElementById('conteudoAba');
        if (abaId === 'geralEqs') carregarEquipamentosServer(box); 
        if (abaId === 'geralOS') carregarOSServer(box);
    }

    function ajustarCamposContratada() {
        const status = document.getElementById('tratarOsStatus').value;
        const boxExec = document.getElementById('boxDelegarExecutante');
        const boxAnexo = document.getElementById('boxAnexoConclusao');
        const lblObs = document.getElementById('lblObs');

        if (status === 'em_execucao') {
            boxExec.classList.remove('hidden'); boxAnexo.classList.add('hidden');
            lblObs.textContent = "Observação / Instrução ao Técnico (Opcional):";
        } else if (status === 'aguardando_peca') {
            boxExec.classList.add('hidden'); boxAnexo.classList.add('hidden');
            lblObs.textContent = "Peça Necessária / Justificativa (Obrigatório):";
        } else if (status === 'concluida') {
            boxExec.classList.add('hidden'); boxAnexo.classList.remove('hidden');
            lblObs.textContent = "Relatório Final de Conclusão (Opcional):";
        }
    }

    async function carregarOSServer(box) {
        box.innerHTML = `<div style="display:flex;justify-content:space-between;margin-bottom:15px;"><h3>Ordens de Serviço Aprovadas</h3><button onclick="carregarOSServer(document.getElementById('conteudoAba'))">Atualizar</button></div><div style="overflow-x:auto;"><table><thead id="headFiltrosOS"><tr><th>ID / Data</th><th>Local</th><th>Equipamento / Defeito</th><th>Status</th><th>Ações</th></tr><tr class="filter-row"><td><input type="text" placeholder="Buscar ID..." oninput="setOsFiltro('id', this.value)"></td><td><input type="text" placeholder="Buscar Comarca..." oninput="setOsFiltro('comarca', this.value)"></td><td></td><td><input type="text" placeholder="Buscar Status..." oninput="setOsFiltro('status', this.value)"></td><td><button class="btn-sm btn-secondary" onclick="limparFiltrosOS()" style="padding:6px;width:100%;">Limpar</button></td></tr></thead><tbody id="tabelaBoxOS"><tr><td colspan="5">Carregando...</td></tr></tbody></table></div>`;
        osCache = await (await apiFetch('/api/os')).json(); desenharTabelaOS();
    }
    function limparFiltrosOS() { osFiltros = { id:'', comarca:'', status:'' }; document.querySelectorAll('#headFiltrosOS input').forEach(i=>i.value=''); desenharTabelaOS(); }
    function setOsFiltro(c, v) { osFiltros[c] = v.toLowerCase(); desenharTabelaOS(); }
    function desenharTabelaOS() {
        const tbody = document.getElementById('tabelaBoxOS');
        let filtrados = osCache.filter(os => {
            if (osFiltros.id && !os.id.toString().includes(osFiltros.id)) return false;
            if (osFiltros.comarca && !(os.comarca||'').toLowerCase().includes(osFiltros.comarca)) return false;
            if (osFiltros.status && !(os.status||'').toLowerCase().includes(osFiltros.status)) return false;
            return true;
        });
        let html = '';
        filtrados.forEach(os => {
            let cor = '#0ea5e9'; if (os.status==='concluida') cor='#10b981'; if (os.status.includes('execucao')) cor='#f59e0b'; if (os.status.includes('peca')) cor='#8b5cf6';
            let btnAnexo = os.arquivo_conclusao ? `<a href="${getApiUrl('/api/uploads/' + os.arquivo_conclusao)}" target="_blank" class="btn-sm btn-success" style="text-decoration:none;display:inline-block;margin-left:4px;">📎 Anexo</a>` : '';
            html += `<tr><td><strong>#${os.id}</strong><br><small>${dataFormatada(os.data_abertura)}</small></td><td><strong>${esc(os.comarca)}</strong><br><small>${esc(os.predio)} (${esc(os.sala)})</small></td><td style="max-width:250px;"><strong>${esc(os.tipo_equipamento)} ${esc(os.capacidade||'')}</strong><br><small style="color:#64748b;">${esc(os.descricao_falha)}</small></td><td><span class="badge" style="background:${cor};color:white;">${os.status.replace('_', ' ').toUpperCase()}</span></td><td><button class="btn-sm btn-secondary" onclick="abrirDetalhesOS(${os.id})">Tratar / Delegar</button> <button class="btn-sm btn-info" onclick="imprimirOSPdf(${os.id})">🖨️ PDF</button> ${btnAnexo}</td></tr>`;
        });
        tbody.innerHTML = html;
    }

    async function abrirDetalhesOS(os_id) {
        document.getElementById('modalTratarOS').classList.remove('hidden');
        document.getElementById('boxTimeline').innerHTML = "Carregando...";
        document.getElementById('tratarOsObs').value = '';
        document.getElementById('arquivoOS').value = '';
        document.getElementById('btnImprimirModal').onclick = () => imprimirOSPdf(os_id);
        
        try {
            const data = await (await apiFetch(`/api/os/${os_id}`)).json();
            const os = data.os; const hist = data.historico;

            document.getElementById('detalheOsId').textContent = `#${os.id}`;
            document.getElementById('detalheOsBadge').textContent = os.status.replace('_', ' ').toUpperCase();
            document.getElementById('detalheOsEquip').textContent = `${esc(os.tipo_equipamento)} ${esc(os.capacidade||'')} (Tombo: ${esc(os.tombo)})`;
            document.getElementById('detalheOsLocal').textContent = `${esc(os.comarca)} - ${esc(os.predio)} / ${esc(os.sala)}`;
            document.getElementById('detalheOsExecutante').textContent = os.nome_executante ? esc(os.nome_executante) : 'NÃO DESIGNADO';
            document.getElementById('detalheOsDefeito').textContent = esc(os.descricao_falha);

            const boxLink = document.getElementById('boxLinkAnexo');
            if (boxLink) {
                if (os.arquivo_conclusao) {
                    boxLink.innerHTML = `<a href="${getApiUrl('/api/uploads/' + os.arquivo_conclusao)}" target="_blank" style="background:#10b981;color:#fff;padding:6px 12px;border-radius:6px;text-decoration:none;font-weight:bold;font-size:12px;display:inline-block;">📎 Ver O.S. Assinada (Anexo)</a>`;
                    boxLink.classList.remove('hidden');
                } else { boxLink.classList.add('hidden'); }
            }

            let htmlHist = '';
            hist.forEach(h => { htmlHist += `<div class="timeline-item"><div class="timeline-date">${dataFormatada(h.data_registro)}</div><div class="timeline-user">${esc(h.nome_usuario)} <span class="badge" style="background:#e2e8f0;color:#475569;">${h.acao}</span></div>${h.observacao ? `<div class="timeline-text">${esc(h.observacao)}</div>` : ''}</div>`; });
            document.getElementById('boxTimeline').innerHTML = htmlHist;
            document.getElementById('tratarOsId').value = os.id;

            const resExec = await (await apiFetch('/api/usuarios')).json();
            const selExec = document.getElementById('tratarOsExecutante');
            selExec.innerHTML = '<option value="">Selecione o Técnico...</option>' + 
                resExec.map(ex => `<option value="${ex.id}" ${os.executante_id === ex.id ? 'selected' : ''}>${esc(ex.nome)}</option>`).join('');

            ajustarCamposContratada();
            if (os.status === 'concluida') document.getElementById('boxAcaoOS').classList.add('hidden');
            else document.getElementById('boxAcaoOS').classList.remove('hidden');

        } catch (err) { document.getElementById('boxTimeline').innerHTML = `<span style="color:red;">Erro ao carregar detalhes.</span>`; }
    }

    async function salvarTratamentoOS(e) {
        e.preventDefault();
        const statusNovo = document.getElementById('tratarOsStatus').value;
        let obsTexto = document.getElementById('tratarOsObs').value.trim().toUpperCase();
        const execId = document.getElementById('tratarOsExecutante').value;
        const fileInput = document.getElementById('arquivoOS');
        let nomeArquivoSalvo = null;

        if (statusNovo === 'em_execucao') {
            if (!execId) return alert("Selecione um Técnico Executante.");
            if (!obsTexto) obsTexto = "ENCAMINHADO PARA O TÉCNICO EXECUTANTE.";
        } else if (statusNovo === 'aguardando_peca') {
            if (!obsTexto) return alert("Relate qual peça está pendente.");
        } else if (statusNovo === 'concluida') {
            if (fileInput.files.length === 0) return alert("Anexe a folha de O.S. assinada (Foto ou PDF).");
            if (!obsTexto) obsTexto = "O.S. CONCLUÍDA COM ANEXO DE COMPROVANTE ASSINADO.";

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            const btn = document.getElementById('btnSalvarTratamento');
            btn.disabled = true; btn.textContent = 'Enviando Foto/PDF...';

            try {
                const resUpload = await apiFetch('/api/upload', { method: 'POST', body: formData });
                const dataUp = await resUpload.json();
                if (!resUpload.ok) throw new Error(dataUp.erro || "Falha no upload");
                nomeArquivoSalvo = dataUp.arquivo;
            } catch (err) {
                alert("Erro ao enviar anexo: " + err.message);
                btn.disabled = false; btn.textContent = 'Confirmar Ação';
                return;
            }
        }

        const btn = document.getElementById('btnSalvarTratamento');
        btn.disabled = true; btn.textContent = 'Gravando...';

        try {
            const p = { 
                status: statusNovo, 
                observacao: obsTexto, 
                executante_id: (statusNovo === 'em_execucao' ? execId : null),
                arquivo_conclusao: nomeArquivoSalvo
            };

            const res = await apiFetch(`/api/os/${document.getElementById('tratarOsId').value}/status`, { 
                method: 'PUT', 
                body: JSON.stringify(p) 
            });
            const data = await res.json();

            if (res.ok) {
                alert("O.S. Atualizada com sucesso!");
                fecharModal('modalTratarOS'); 
                await carregarOSServer(document.getElementById('conteudoAba'));
            } else {
                alert("Erro: " + (data.erro || "Falha ao gravar."));
            }
        } catch(err) {
            alert("Erro de comunicação com o servidor.");
        } finally {
            btn.disabled = false; btn.textContent = 'Confirmar Ação';
        }
    }

    async function carregarEquipamentosServer(box) {
        box.innerHTML = `<div style="display:flex;justify-content:space-between;margin-bottom:15px;"><h3>Equipamentos Atendidos</h3></div><div style="overflow-x:auto;"><table><thead id="headFiltrosEq"></thead><tbody id="tabelaBoxEq"><tr><td colspan="8">Carregando...</td></tr></tbody></table></div><div id="totalEqs" style="font-size:12px;color:#64748b;margin-top:10px;"></div>`;
        equipamentosCache = await (await apiFetch('/api/equipamentos')).json();
        renderizarCabecalhoEq(); desenharTabelaEquipamentos();
    }
    function renderizarCabecalhoEq() {
        const iconSort = eqSortAsc ? ' ▴' : ' ▾'; const col = (n, c) => `<th onclick="setEqSort('${c}')">${n}${eqSortCol === c ? iconSort : ''}</th>`;
        document.getElementById('headFiltrosEq').innerHTML = `<tr>${col('Comarca','comarca')}${col('Prédio','predio')}${col('Local','sala')}${col('Equipamento','tipo_equipamento')}${col('Cap','capacidade')}${col('Tombo','tombo')}${col('Status','status')}<th>Ações</th></tr>
            <tr class="filter-row">
                <td><input type="text" placeholder="Buscar..." oninput="debounceFiltroEq('comarca', this.value)" value="${eqFiltros.comarca}"></td>
                <td><input type="text" placeholder="Buscar..." oninput="debounceFiltroEq('predio', this.value)" value="${eqFiltros.predio}"></td>
                <td><input type="text" placeholder="Buscar..." oninput="debounceFiltroEq('sala', this.value)" value="${eqFiltros.sala}"></td>
                <td><input type="text" placeholder="Buscar..." oninput="debounceFiltroEq('tipo', this.value)" value="${eqFiltros.tipo}"></td>
                <td><input type="text" placeholder="Buscar..." oninput="debounceFiltroEq('cap', this.value)" value="${eqFiltros.cap}"></td>
                <td><input type="text" placeholder="Buscar..." oninput="debounceFiltroEq('tombo', this.value)" value="${eqFiltros.tombo}"></td>
                <td><input type="text" placeholder="ativo/inativo" oninput="debounceFiltroEq('status', this.value)" value="${eqFiltros.status}"></td>
                <td><button class="btn-sm btn-secondary" onclick="limparFiltrosEq()" style="padding:6px;width:100%;">Limpar</button></td>
            </tr>`;
    }
    function debounceFiltroEq(c, v) { clearTimeout(eqDebounceTimeout); eqDebounceTimeout = setTimeout(() => { eqFiltros[c] = v.toLowerCase(); desenharTabelaEquipamentos(); }, 250); }
    function limparFiltrosEq() { eqFiltros = { comarca:'', predio:'', sala:'', tipo:'', cap:'', tombo:'', status:'' }; renderizarCabecalhoEq(); desenharTabelaEquipamentos(); }
    function setEqSort(c) { if (eqSortCol === c) eqSortAsc = !eqSortAsc; else { eqSortCol = c; eqSortAsc = true; } renderizarCabecalhoEq(); desenharTabelaEquipamentos(); }

    function desenharTabelaEquipamentos() {
        const tbody = document.getElementById('tabelaBoxEq');
        let filtrados = equipamentosCache.filter(eq => {
            if (eqFiltros.comarca && !(eq.comarca||'').toLowerCase().includes(eqFiltros.comarca)) return false;
            if (eqFiltros.predio && !(eq.predio||'').toLowerCase().includes(eqFiltros.predio)) return false;
            if (eqFiltros.sala && !(eq.sala||'').toLowerCase().includes(eqFiltros.sala)) return false;
            if (eqFiltros.tipo && !(eq.tipo_equipamento||'').toLowerCase().includes(eqFiltros.tipo)) return false;
            if (eqFiltros.cap && !(eq.capacidade||'').toLowerCase().includes(eqFiltros.cap)) return false;
            if (eqFiltros.tombo && !(eq.tombo||'').toLowerCase().includes(eqFiltros.tombo)) return false;
            if (eqFiltros.status && !(eq.ativo === 1 ? 'ativo' : 'inativo').includes(eqFiltros.status)) return false;
            return true;
        });
        filtrados.sort((a, b) => {
            let valA = (a[eqSortCol] || '').toString().toLowerCase(); let valB = (b[eqSortCol] || '').toString().toLowerCase();
            if (valA < valB) return eqSortAsc ? -1 : 1; if (valA > valB) return eqSortAsc ? 1 : -1; return 0;
        });

        let html = '';
        filtrados.forEach(eq => {
            const rowClass = eq.ativo === 0 ? 'inativo' : (eq.tem_os_ativa > 0 ? 'row-os-ativa' : '');
            const statusLabel = eq.ativo === 1 ? '<span style="color:var(--success);font-weight:bold;">Ativo</span>' : '<span style="color:var(--danger);font-weight:bold;">Inativo</span>';
            html += `<tr class="${rowClass}"><td>${esc(eq.comarca)}</td><td>${esc(eq.predio)}</td><td>${esc(eq.sala)}</td><td>${esc(eq.tipo_equipamento)}</td><td>${esc(eq.capacidade||'-')}</td><td>${eq.tombo === 'S/T' ? '<span class="badge" style="background:#e2e8f0;color:#64748b;">S/T</span>' : esc(eq.tombo)}</td><td>${statusLabel}</td><td style="white-space:nowrap;"><button class="btn-sm btn-warning" onclick="abrirHistoricoEqOS(${eq.id})">Ver O.S.</button></td></tr>`;
        });
        tbody.innerHTML = html; document.getElementById('totalEqs').textContent = `Total: ${filtrados.length} equipamento(s).`;
    }

    async function abrirHistoricoEqOS(eq_id) {
        document.getElementById('modalHistoricoEqOS').classList.remove('hidden');
        const tbody = document.getElementById('tabelaHistoricoEqOS');
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Carregando histórico...</td></tr>';
        try {
            let chamados = await (await apiFetch(`/api/equipamentos/${eq_id}/os`)).json();
            chamados = chamados.filter(os => os.status !== 'aberta');
            if (chamados.length === 0) { tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Nenhuma O.S. aprovada para este equipamento.</td></tr>'; return; }
            let html = '';
            chamados.forEach(os => {
                let cor = '#0ea5e9'; if (os.status==='concluida') cor='#10b981'; if (os.status.includes('execucao')) cor='#f59e0b'; if (os.status.includes('peca')) cor='#8b5cf6';
                let btnAnexo = os.arquivo_conclusao ? `<a href="${getApiUrl('/api/uploads/' + os.arquivo_conclusao)}" target="_blank" class="btn-sm btn-success" style="text-decoration:none;display:inline-block;margin-left:4px;">📎 Anexo</a>` : '';
                html += `<tr><td><strong>#${os.id}</strong><br><small>${dataFormatada(os.data_abertura)}</small></td><td><small style="color:#64748b;">${esc(os.descricao_falha)}</small></td><td><span class="badge" style="background:${cor};color:white;">${os.status.replace('_', ' ').toUpperCase()}</span></td><td><button class="btn-sm btn-secondary" onclick="fecharModal('modalHistoricoEqOS'); abrirDetalhesOS(${os.id});">Detalhes</button> <button class="btn-sm btn-info" onclick="imprimirOSPdf(${os.id})">🖨️ PDF</button> ${btnAnexo}</td></tr>`;
            });
            tbody.innerHTML = html;
        } catch (err) { tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:red;">Erro ao buscar dados.</td></tr>'; }
    }
</script>
